<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Rakjai — Discover & Track BL & GL Series</title>

    <meta name="description" content="Rakjai is a mobile application for discovering and tracking BL and GL series.">

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;

            font-family: Arial, sans-serif;

            background:
                radial-gradient(circle at top, #24154d, #0d0b18 60%);

            color: white;
        }

        .container {
            max-width: 700px;
            padding: 40px;
            text-align: center;
        }

        .logo {
            font-size: 52px;
            font-weight: 700;
            margin-bottom: 20px;
        }

        .logo span {
            color: #886cfd;
        }

        h1 {
            font-size: 36px;
            margin-bottom: 20px;
        }

        p {
            color: #b9b4c9;
            font-size: 18px;
            line-height: 1.6;
        }

        .status {
            display: inline-block;
            margin-top: 25px;
            padding: 10px 18px;
            border-radius: 20px;
            background: rgba(136, 108, 253, 0.15);
            color: #a995ff;
            font-size: 14px;
        }

        footer {
            margin-top: 50px;
            color: #777;
            font-size: 13px;
        }
    </style>
</head>

<body>

    <main class="container">

        <div class="logo">
            rakjai<span>.</span>
        </div>

        <h1>
            Discover. Track. Enjoy.
        </h1>

        <p>
            Rakjai is a mobile application for discovering
            and tracking BL & GL series.
        </p>

        <p>
            Explore series, follow upcoming releases,
            track episodes and discover new stories.
        </p>

        <div class="status">
            🚧 Currently in development
        </div>

        <footer>
            © 2026 Rakjai. All rights reserved. ·
            <a href="/privacy" style="color:#a995ff;">Privacy Policy</a>
        </footer>

    </main>

</body>

</html>
